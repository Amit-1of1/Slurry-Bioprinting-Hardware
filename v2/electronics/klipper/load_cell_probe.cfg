# OPTIONAL advanced path (Linux computer + Klipper firmware on the Ender 3).
# Stock Marlin + OctoPrint + the sensor box is the recommended path; use this
# only if you already run Klipper. The HX711 then wires to the Ender board's
# spare pins instead of the Nano (check your board's pinout; pins below are
# placeholders for a Creality 4.2.x board's free header and MUST be checked).
# Docs: https://www.klipper3d.org/Load_Cell.html

[load_cell]
sensor_type: hx711
dout_pin: PA_CHANGE_ME
sclk_pin: PA_CHANGE_ME
# run LOAD_CELL_CALIBRATE once, then SAVE_CONFIG

[gcode_button syringe_empty]
pin: ^!PA_CHANGE_ME
press_gcode:
  PAUSE
  M117 Syringe empty

[gcode_macro CHECK_CLOG]
# call from your slicer every few layers, or run a delayed_gcode loop
gcode:
  {% set f = printer.load_cell.force_g|float %}
  {% if f > 4000 %}
    PAUSE
    M117 Clog {f|int} g
  {% endif %}
