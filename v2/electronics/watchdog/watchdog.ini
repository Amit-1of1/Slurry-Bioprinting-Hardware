# Copy to watchdog_local.ini and edit. Keep your API key out of git.
[octoprint]
url = http://127.0.0.1:5000
# OctoPrint > Settings > Application Keys (or API) > create a key, paste here
api_key = PASTE_YOUR_KEY_HERE

[sensor_box]
# Windows: COM5 (Device Manager > Ports). Linux: /dev/ttyUSB0. Leave "auto" to search.
port = auto
baud = 115200

[rules]
# pause if the plunger force stays above this for clog_seconds (grams-force)
clog_limit_g = 4000
clog_seconds = 1.5
# pause if force drops below this while printing for empty_seconds (air / empty / broken needle)
min_print_g = 30
empty_seconds = 4
pause_on_end_switch = yes
pause_on_door_open = no

[probe]
# Z-zero routine: needle must be the metal-Luer blunt needle, plate wired to GND
plate_thickness_mm = 1.6
coarse_step_mm = 0.5
fine_step_mm = 0.05
max_travel_mm = 25

[log]
# a CSV of time, force and switches is written here for every session
folder = logs
